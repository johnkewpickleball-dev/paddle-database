<title>KewCOR Session Runner</title>
<style>
  :root{
    --navy:#1f3864; --ink:#1a1f2b; --muted:#6b7280; --line:#e3e7ee; --bg:#f6f7fa;
    --card:#fff; --amber:#b45309; --amberbg:#fef3c7; --red:#b91c1c; --redbg:#fee2e2;
    --ok:#1e40af; --okbg:#dbeafe; --paste:#fde3c8; --calc:#f3f4f6;
  }
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       color:var(--ink);background:var(--bg)}
  header{background:var(--navy);color:#fff;padding:14px 22px;display:flex;align-items:baseline;gap:14px}
  header h1{margin:0;font-size:19px;letter-spacing:.2px}
  header .sub{opacity:.72;font-size:13px}
  .wrap{display:grid;grid-template-columns:224px 1fr;gap:0;min-height:calc(100vh - 52px)}
  /* step rail */
  nav{background:#fff;border-right:1px solid var(--line);padding:16px 0}
  .step{display:flex;gap:10px;align-items:flex-start;padding:9px 16px;cursor:pointer;border-left:3px solid transparent}
  .step:hover{background:#fafbfd}
  .step.on{border-left-color:var(--navy);background:#f4f7fd}
  .step.done .dot{background:var(--navy);color:#fff;border-color:var(--navy)}
  .step.locked{opacity:.42;cursor:not-allowed}
  .dot{flex:0 0 22px;height:22px;border-radius:50%;border:1.5px solid #c3cad8;display:grid;
       place-items:center;font-size:11px;font-weight:700;color:#8892a6;background:#fff}
  .step b{display:block;font-size:13.5px;font-weight:600}
  .step span{display:block;font-size:11.5px;color:var(--muted)}
  main{padding:22px 26px 60px;max-width:1080px}
  h2{margin:0 0 3px;font-size:20px;color:var(--navy)}
  .lede{color:var(--muted);margin:0 0 18px;font-size:13.5px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:16px 18px;margin-bottom:14px}
  .card h3{margin:0 0 12px;font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--navy)}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
  label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
  input,select,textarea{width:100%;padding:7px 9px;border:1px solid #cfd6e2;border-radius:6px;
       font:inherit;font-size:14px;background:#fff}
  input:focus,select:focus,textarea:focus{outline:2px solid #9db4e0;border-color:#9db4e0}
  input.paste,textarea.paste{background:var(--paste)}
  textarea{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;min-height:112px;resize:vertical}
  .out{background:var(--calc);border:1px solid var(--line);border-radius:6px;padding:7px 9px;font-variant-numeric:tabular-nums}
  button{font:inherit;padding:9px 17px;border-radius:7px;border:1px solid var(--navy);
       background:var(--navy);color:#fff;cursor:pointer;font-weight:600}
  button.ghost{background:#fff;color:var(--navy)}
  button:disabled{opacity:.4;cursor:not-allowed}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px}
  table{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
  th{background:var(--navy);color:#fff;font-weight:600;padding:6px 7px;text-align:center;font-size:11.5px}
  td{padding:5px 7px;border-bottom:1px solid #eef1f6;text-align:center}
  td.l{text-align:left}
  tr.rej td{color:#9aa3b2}
  tr.bad td{background:var(--redbg)}
  .status{display:inline-block;padding:1px 7px;border-radius:20px;font-size:11px;font-weight:600}
  .s-use{background:var(--okbg);color:var(--ok)} .s-rej{background:var(--amberbg);color:var(--amber)}
  .s-bad{background:var(--redbg);color:var(--red)}
  .banner{border-radius:7px;padding:11px 14px;margin-bottom:13px;font-size:13.5px;display:flex;gap:9px}
  .b-ok{background:var(--okbg);color:#173a7a} .b-warn{background:var(--amberbg);color:#7c3f06}
  .b-bad{background:var(--redbg);color:#8c1616} .b-mute{background:#eef0f4;color:#4b5563}
  .kpi{display:flex;gap:26px;flex-wrap:wrap}
  .kpi div{min-width:96px} .kpi b{display:block;font-size:22px;color:var(--navy);font-variant-numeric:tabular-nums}
  .kpi span{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  /* info bubbles — the walls of text live in here now */
  .i{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;
     background:#dbe3f1;color:var(--navy);font-size:11px;font-weight:700;cursor:pointer;
     margin-left:5px;vertical-align:middle;border:0;padding:0;font-family:Georgia,serif}
  .i:hover{background:var(--navy);color:#fff}
  dialog{border:0;border-radius:11px;padding:0;max-width:620px;width:92vw;box-shadow:0 18px 50px rgba(16,24,40,.24)}
  dialog::backdrop{background:rgba(16,24,40,.42)}
  dialog .dh{background:var(--navy);color:#fff;padding:13px 18px;font-weight:600;font-size:14.5px}
  dialog .db{padding:16px 18px;font-size:13.5px;line-height:1.62;white-space:pre-wrap}
  dialog .df{padding:0 18px 16px;text-align:right}
  .muted{color:var(--muted);font-size:12.5px}
  .pill{font-size:11px;padding:2px 8px;border-radius:20px;background:#eef0f4;color:#4b5563}
  .pill.use{background:var(--okbg);color:var(--ok)} .pill.warn{background:var(--amberbg);color:var(--amber)}
  .pill.bad{background:var(--redbg);color:var(--red)}
  /* mode switch — the session flow and the shelf are the two halves of the job */
  header .modes{margin-left:auto;display:flex;gap:6px}
  header .modes button{padding:5px 14px;font-size:13px;border-radius:20px;font-weight:600;
       border:1px solid rgba(255,255,255,.42);background:transparent;color:#fff}
  header .modes button.on{background:#fff;color:var(--navy);border-color:#fff}
  /* the step rail belongs to the session. On the shelf there are no steps. */
  .wrap.solo{grid-template-columns:1fr}
  .wrap.solo nav{display:none}
  .secret{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.06em}
  td.l{text-align:left}
  tr.dim td{color:#9aa3b2}
</style>

<body>
<header>
  <h1>KewCOR</h1>
  <div class="sub" id="hdrsub">prototype — the arithmetic is checked against the workbook</div>
  <div class="modes" id="modes"></div>
</header>

<div class="wrap">
  <nav id="rail"></nav>
  <main id="main"></main>
</div>

<dialog id="info"><div class="dh" id="ih"></div><div class="db" id="ib"></div>
  <div class="df"><button class="ghost" onclick="info.close()">Close</button></div></dialog>

<script src="kewcor-core.js"></script>
<script>
'use strict';
const K = window.KewCOR;

/* ── the explanatory text, out of the way until asked for ─────────────────── */
const NOTES = {
  anchor: ["The anchor paddle",
    "ANCHOR 2 (TFG-4) is the working control. ANCHOR 3 (TFW-3) is the spare and sits on the same published scale, so switching needs no adjustment.\n\nANCHOR 1 (TFG-1) is RETIRED — reference only. Its face is worn and its P_ref no longer describes it. Pick it only to re-run a paddle entered before the changeover.\n\nP_ref is a CONSTANT for each paddle, never recomputed. Anchors 2 and 3 were derived from Anchor 1 by direct crossover, which is what puts all three on one scale."],
  prior: ["Prior impacts and the @70 box",
    "Two boxes, on purpose. On the left, impacts this ball has taken at 50 mph — the running total from the registry. On the right, shots from an accelerated wear phase at 70 mph.\n\nA 70 mph wear shot counts as 0.44 of a 50 mph impact — LESS, not more. The wear rig clamps the paddle at 30 degrees so it can throw the spin-off durability testing records, so those are glancing blows. Only the square-on component of the closing speed compresses the core, and at 30 degrees that is 35 mph.\n\nSo a standard 100-shot wear phase leaves a ball around 44 effective impacts old: still on the steep part of the wear curve."],
  control: ["The weekly control block",
    "Ten shots at 6 in from the tip, in the same session as the control blocks, so ball, temperature and cannon all cancel in the difference.\n\nIt was going to be the mirror image of the crosshair across the centerline — same distance from the pivot, identical in every way except wear. The rig aims along the paddle's long axis only, so that point cannot be reached. 6 in is 1.9 in clear of the 4.07 crosshair, so the worn zone can never reach it.\n\nThe price is that it is a genuinely different location: different pivot-to-impact distance, different effective mass, different intrinsic PBCoR. So the raw gap is mostly face map, not wear. Only the CHANGE in the gap across readings measures anything, and only while the spot never moves.\n\nWhy weekly and not every session: the control has to stay less worn than the crosshair. At one session in three the wear ratio is 7:1 and the measured gap under-reads by about 14%; shot every session it is 2:1 and under-reads by half."],
  deflection: ["Deflection — the anchor monitor",
    "Takes a minute, costs no shots, and is the tripwire for the anchor going soft.\n\nPress the gauge at the SAME spot every time, and as near the crosshair as the rig allows. The anchor's wear is uniquely concentrated — twenty-odd shots a session at one point, where a test paddle spreads them over four — so a reading taken at the geometric center can be blind to exactly the damage you are watching for.\n\nAcross 211 paddles, 1 lb of deflection is worth about 0.0012 of KewCOR, so the 0.005 that matters is roughly 4 lbs. That conversion is cross-sectional and provisional: it says how deflection and KewCOR vary BETWEEN designs, not how they move together within one paddle over time."],
  paste: ["Pasting gate data",
    "DO NOT SORT IT. The rows must stay in the order you fired them.\n\nEvery shot is placed in the ball's life by its position in the block, and the correction each location gets is taken at the moment that block was actually fired. Sorting scrambles that, and the damage is silent — the numbers still look reasonable, they are just wrong.\n\nDo not remove the bad shots either. The ball felt every one of them and the wear accounting needs the real count.\n\nThree columns: Inbound, Outbound, COR. Tabs, commas or spaces all work."],
  window: ["Why ±7 mph is safe",
    "The cannon runs an inbound sd of 4.29 mph. At ±3 you keep half your shots; at ±7 you keep about 90%.\n\nIt is only safe because every shot is corrected to 50 mph BEFORE anything is averaged, using a slope of −0.00451 PBCoR per mph measured on these paddles at this location over two sessions."],
  mid: ["The MID block",
    "A third control reading, shot between paddles 2 and 3.\n\nBall COR decays exponentially, so the correction between PRE and POST follows a curve, not a straight line. The ramp already bends to that curve using a decay constant borrowed from LT-15. The MID block is what makes that borrowing unnecessary: with a third reading the ramp is anchored on measurements in both halves of the session.\n\nIt is asked for when the ball is under 190 effective impacts and the session runs more than about 90 paddle impacts — in practice, a ball's first session or two after its wear phase, and almost never after that.\n\nIf you decide to stop after two paddles, this block becomes the POST block. Nothing is wasted."],
  drift: ["POOLED or RAMP",
    "PRE and POST are a FAILURE DETECTOR before they are a drift meter.\n\nOn a settled ball the true drift across a session is about 0.001, while each block carries a standard error near 0.005. Most sessions the difference you measure is noise, and ramping on noise adds error to every paddle instead of removing it. So AUTO ramps only when PRE and POST differ by more than two standard errors.\n\nOn a ball fresh off its wear phase, expect RAMP — that one really is still breaking in. On an old ball, RAMP means something mechanical happened: go and look at the seam."],
  block: ["One correction per paddle",
    "Every location on a paddle carries the SAME ball correction, taken once at that paddle's midpoint on the wear curve.\n\nTHIS TILTS THE FACE MAP, ON PURPOSE. Locations are shot in order, 3 in first, so the top of the face meets the freshest ball of that paddle and the bottom meets the most worn one. Raw PBCoR therefore comes out a little high at 3 in and a little low at 6 in.\n\nUntil 2026-08-27 each location block carried its own correction, which canceled that exactly. On a simulation where the true COR is identical at every location and there is no measurement noise, per-block returns the flat truth to 0.0003; one D per paddle leans the map toward the top by about 0.017 across a 3–6 in run.\n\nThat was given back knowingly. Almost every paddle measured the per-block way peaked at 6 in, which disagrees with years of published results and with how the paddles play, and comparability with the archive was judged worth more than an unbiased face map. It is a business call, not a physics claim — do not describe this face map as unbiased.\n\nThe ramp BETWEEN paddles stays. Paddle 1 and paddle 4 sat at genuinely different points on the ball's life, and that difference IS bracketed by measured control blocks."],
  kewcor: ["KewCOR",
    "KewCOR = SQRT(PBCoR@50² + D), where D = P_ref² − P_ctrl².\n\nThe correction is applied to the LOCATION MEAN, not shot by shot, so a noisy individual shot cannot leak in through the square root.\n\nPeak location is read off the measured values, never off the curve on the chart — that curve is a smoothed spline through four or five points and can bulge slightly past the highest one."],
  axis: ["The vertical axis",
    "Locked to a 0.07 window, the same span the KewCOR curve uses on the website, and centered on this paddle's own values so the shape fills the frame.\n\nIf a paddle's range is wider than 0.07 the window opens to fit it, with 0.01 of headroom above and below. The span is printed under the chart so you can always see which of the two you are looking at."]
};
function bubble(k){ const [h,b]=NOTES[k]; ih.textContent=h; ib.textContent=b; info.showModal(); }

/* ── session state, with a local draft so a refresh cannot cost you the day ── */
const LOC_ALL = [3,4,5,6,7];
const blankPaddle = () => ({name:'',len:'',sw:'',mfr:'',pmNote:'',pmWarn:'',use7:false,
                            spec:{}, shots:{}, archive:null});
const DEFAULT = {
  regBall:null,
  date:new Date().toISOString().slice(0,10), person:'', temp:'',
  anchor:'Anchor 2', ballId:'LT-89', prior:133, wear:100, deflection:'',
  paddles:[blankPaddle(),blankPaddle()],
  pre:'', mid:'', post:'', mirror:'', midAfter:2, endedEarly:false,
  // Which spot the weekly control block was shot at. Logged on every anchor row so a
  // change is visible in the record instead of silently stepping the series.
  controlSpot:6,
  registryUrl:'', step:0, mode:'session',
  // What has already reached the registry, kept in the draft so that a refresh — or a
  // second click on a button that already worked — cannot produce a second row.
  sent:{session:null, anchor:null}
};
const DRAFT='kewcor.draft.v1';
let S = (()=>{ try{ const j=JSON.parse(localStorage.getItem(DRAFT)); if(j&&j.paddles) return Object.assign({},DEFAULT,j);}catch(e){} return JSON.parse(JSON.stringify(DEFAULT)); })();
let saveTimer=null;
function save(){ clearTimeout(saveTimer); saveTimer=setTimeout(()=>{
  try{ localStorage.setItem(DRAFT, JSON.stringify(S)); }catch(e){} },250); }
/* ── the draft is the only copy ────────────────────────────────────────────
 * Until a paddle is archived, its raw shots exist in this browser's localStorage and
 * nowhere else. Not on the sheet, not in Drive, not in the session row — that row
 * carries the corrections, not the shots. A cleared profile, a different machine, or
 * one press of "Finish and start a new session" ends them.
 *
 * This was not hypothetical. A whole session was lost that way and had to be pulled
 * back out of the browser's write-ahead log. So: the draft goes to a file and comes
 * back from one, and the button that deletes it refuses while anything is unsaved. */
function atRisk(){
  const out=[];
  S.paddles.forEach((p,i)=>{
    if(paddleResults(i) && !p.archive)
      out.push('• '+(p.name || ('Paddle '+(i+1)))+' has results and has NOT been archived.');
  });
  if(S.paddles.some((p,i)=>paddleResults(i)) && !S.sent.session)
    out.push('• The session row has NOT been logged to the registry.');
  return out;
}
function draftFileName(){ return 'kewcor-draft-'+(S.date||'undated')+'.json'; }
function exportDraft(btn){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));
  a.download=draftFileName();
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  if(btn){ const t=btn.textContent; btn.textContent='Saved as '+draftFileName();
           setTimeout(()=>{ btn.textContent=t; },2800); }
}
function restoreDraft(input){
  const f=input.files && input.files[0]; input.value='';
  if(!f) return;
  const fr=new FileReader();
  fr.onload=()=>{
    let j;
    try{ j=JSON.parse(fr.result); }
    catch(e){ alert('That file could not be read as JSON, so nothing was changed.\n\n'+e.message); return; }
    // A draft has paddles. Anything else is some other file with a .json name, and
    // loading it would replace a live session with nonsense.
    if(!j || !Array.isArray(j.paddles)){
      alert('That does not look like a KewCOR draft — a draft carries a list of paddles.\n\nNothing was changed.');
      return; }
    const risk=atRisk();
    if(risk.length && !confirm('Restoring replaces the session that is open now:\n\n'
        +risk.join('\n')+'\n\nReplace it anyway?')) return;
    S=Object.assign({},DEFAULT,j);
    if(!S.paddles.length) S.paddles=[blankPaddle(),blankPaddle()];
    // A draft restored onto a machine that has never seen the registry can still send,
    // because the draft brought the registry with it.
    if(!REGID && S.registryUrl){ const id=sheetId(S.registryUrl);
      if(id){ REGID=id; try{ localStorage.setItem(REG_KEY,id); }catch(e){}
              RG.state='idle'; loadShelf(); } }
    WR={busy:'',tone:'ok',msg:'Restored '+f.name+'.',
        detail:(S.date||'undated')+' · '+(S.ballId||'no ball')+' · '
             +S.paddles.filter(p=>p.name).length+' paddles. Read this screen before sending '
             +'anything — a restored draft remembers what it had already sent, and any row '
             +'sent before a correction still holds the old numbers.'};
    WRSCOPE='reset'; go(0);
  };
  fr.readAsText(f);
}
function resetAll(){
  const risk=atRisk();
  if(risk.length){
    // Refused, not warned. Everything on that list is gone by the time a confirm box has
    // been dismissed, and a confirm box gets dismissed by reflex.
    WR={busy:'',tone:'bad',msg:'Not yet — this session is not stored anywhere else.',
        detail:risk.join('  ')+'  Clearing now deletes the only copy of those shots. '
             +'Archive each paddle, then send the session row. If you have to stop before '
             +'that, save the draft to a file first and keep the file.'};
    WRSCOPE='reset'; render(); return;
  }
  if(!confirm('Clear this session and start a new one? The draft is deleted.')) return;
  try{ localStorage.removeItem(DRAFT); }catch(e){}
  S=JSON.parse(JSON.stringify(DEFAULT)); S.paddles=[blankPaddle(),blankPaddle()]; render();
  // Re-read the shelf. The ball's counts are the FIRST thing the new session takes off the
  // registry, and the copy in memory is as old as the page — it does not see a session row
  // logged since, nor a correction typed into Other prior. Starting a session from a stale
  // shelf understates the ball's age, and the number is copied into the draft by applyBall
  // where nothing later questions it.
  if(REGID) loadShelf(); }

const STEPS = [
  {t:'Session',  s:'ball, anchor, paddles'},
  {t:'PRE',      s:'10 control shots'},
  {t:'Paddle 1', s:'by location'},
  {t:'Paddle 2', s:'by location'},
  {t:'MID',      s:'when asked'},
  {t:'Paddle 3', s:'optional'},
  {t:'Paddle 4', s:'optional'},
  {t:'POST',     s:'10 control shots'},
  {t:'Results',  s:'read and send'}
];

/* ── Paddle Metrics, live ─────────────────────────────────────────────────── */
const PM_SHEET='1LyJMxNydRdoCbguGYDE6b77hz6_pBsPMI6IF3oolBcg', PM_TAB='Source Entry';
// Setup C38-C43 for the two the math needs, C48-C53 for the six the client report
// shows. 1 = column A of the Source Entry tab.
const PM_COL={name:1, date:2, swing:5, length:10, mfr:23,
              defl:3, wt:4, tw:6, bp:7, w:12, hl:15};
let PM={rows:[], state:'idle', msg:''};
function csv(text){
  const out=[]; let row=[], f='', q=false;
  for(let i=0;i<text.length;i++){ const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if(c==='"') q=true;
    else if(c===','){ row.push(f); f=''; }
    else if(c==='\n'){ row.push(f); out.push(row); row=[]; f=''; }
    else if(c!=='\r') f+=c;
  }
  if(f||row.length){ row.push(f); out.push(row); }
  return out;
}
/* ── The Ball Registry, live ───────────────────────────────────────────────
 * Shelf!A15:N75 — the same range the calculator's IMPORTRANGE pulls. Row 15 is the
 * header, so gviz's range parameter lines the columns up for us.
 *
 * The registry's id is NOT hardcoded. The workbook keeps it in Setup C56 because it
 * is a thing John pastes once, and doing the same here means this file never has to
 * be edited to point at a different registry.                                    */
const REG_KEY='kewcor.registry.v1', REG_TAB='Shelf', REG_RANGE='A15:S75';
const REG_COL={id:1, since:2, wear:3, otherPrior:4, status:5, sessions:6,
               logged:7, age:8, stage:9, room:10, paddles:11, lastUsed:12,
               lastPre:13, agrees:14,
               // out to S, because the retire form writes into this half and the
               // registry's own "RETIRED WITHOUT A REASON" check reads it
               retiredOn:15, why:16, crackAt:17, notes:18, record:19};
const BALL_STATUS = ['IN ROTATION','RESERVED','RETIRED','CRACKED'];
const BALL_WHY    = ['WORN OUT','SEAM CRACK','OTHER DAMAGE','LOST','END OF STUDY'];
let REGID = (()=>{ try{ return localStorage.getItem(REG_KEY)||''; }catch(e){ return ''; } })();
let RG={rows:[], state:REGID?'idle':'unset', msg:''};

// Accepts a full Google Sheets URL or a bare id — whichever is on the clipboard.
function sheetId(v){
  const m=String(v||'').match(/\/spreadsheets\/d\/([a-zA-Z0-9_-]{20,})/);
  return m ? m[1] : (/^[a-zA-Z0-9_-]{20,}$/.test(String(v||'').trim()) ? String(v).trim() : '');
}
function setRegistry(v){
  const id=sheetId(v);
  if(!id){ RG={rows:[],state:'badurl',msg:'That does not look like a Google Sheets link. '
      + 'Open the registry and copy the whole URL from the address bar.'}; return render(); }
  REGID=id; try{ localStorage.setItem(REG_KEY,id); }catch(e){}
  // Carry it in the draft too. The draft is the thing that gets saved to a file and
  // opened somewhere else; a draft that knows its own registry reconnects on arrival
  // instead of arriving unable to send.
  S.registryUrl=id; save();
  loadShelf();
}
function forgetRegistry(){
  // This button sits next to the ball picker and used to disconnect on one click, with
  // no confirmation and nothing on screen afterwards to say the connection was gone.
  // Every write reads the sheet back to confirm itself, so disconnecting mid-session
  // does not degrade the writes — it refuses them. That is very likely what ended the
  // session of 2026-08-26: the anchor row went in, the registry was dropped, and the
  // session row was then refused for a reason that read like a failure of the network.
  if(!confirm('Disconnect the ball registry?\n\nNothing can be sent to it until it is '
    + 'connected again — not the session row, not the anchor reading, not an archive. '
    + 'Do this between sessions, not during one.')) return;
  REGID=''; try{ localStorage.removeItem(REG_KEY); }catch(e){}
  S.registryUrl=''; save();
  RG={rows:[],state:'unset',msg:''}; render();
}

/* ── the write endpoint ────────────────────────────────────────────────────
 * The URL and the secret are kept on THIS MACHINE, not in this file. Two reasons,
 * and the second is the real one:
 *
 *   - the file can be published without editing it, the way the registry id already is;
 *   - the published page then carries NO SECRET AT ALL. Anyone who finds the unlisted
 *     page can read it and cannot write to it.
 *
 * The registry's Apps Script tab still describes the secret as "obfuscation, not
 * security", which was true when the plan was to bake it into the page. It is a
 * stronger claim than that now, though still not a lock: anyone at this keyboard has it.
 *
 * text/plain, deliberately. A JSON content type makes the browser send a CORS preflight
 * that Apps Script does not answer; text/plain is on the safelist, so the POST goes
 * straight out and the reply — which does carry Access-Control-Allow-Origin — is
 * readable. That is what lets a write report the row it landed on instead of vanishing
 * into no-cors and being taken on trust.                                              */
/* The endpoint build this page is written against. Compared, never assumed.
 *
 * The check used to read `j.version===2 ? '' : <warning>`, written when 2 was current —
 * so the moment build 3 went live it warned about the CORRECT build, in a blue banner,
 * with wording about features build 3 actually has. A hardcoded "current" is a landmine
 * with a timer on it; a hardcoded EXPECTED is just a fact this page knows about itself. */
const WANT_BUILD = 4;
const EP_KEY='kewcor.endpoint.v1';
let EP = (()=>{ try{ return Object.assign({url:'',secret:''},
    JSON.parse(localStorage.getItem(EP_KEY)||'{}')); }catch(e){ return {url:'',secret:''}; } })();
let WR = {busy:'', msg:'', tone:'', detail:''};

function setEndpoint(url, secret){
  const u=(url||'').trim();
  if(u && !/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(u)){
    WR={busy:'',tone:'bad',msg:'That is not the /exec URL.',
        detail:'It should look like https://script.google.com/macros/s/AKfy…/exec — '
             + 'the Deploy dialog gives it to you. A /dev URL only works while you are '
             + 'signed in to the script editor, which is not the same thing.'};
    return render();
  }
  EP={url:u, secret:(secret||'').trim()};
  try{ localStorage.setItem(EP_KEY, JSON.stringify(EP)); }catch(e){}
  WR={busy:'',tone:'',msg:'',detail:''};
  if(EP.url) pingEndpoint(); else render();
}
function forgetEndpoint(){
  EP={url:'',secret:''};
  try{ localStorage.removeItem(EP_KEY); }catch(e){}
  WR={busy:'',tone:'',msg:'',detail:''}; render();
}

function post(op, payload){
  if(!EP.url) return Promise.reject(new Error(
    'No write endpoint set. Open the Ball registry tab and paste the /exec URL and the secret.'));
  const body=JSON.stringify(Object.assign({op, secret:EP.secret}, payload||{}));
  return fetch(EP.url, {method:'POST', body, redirect:'follow',
                        headers:{'Content-Type':'text/plain;charset=utf-8'}})
    .then(r=>r.text().then(t=>({status:r.status, t})))
    .then(({status,t})=>{
      let j;
      try{ j=JSON.parse(t); }
      catch(e){
        throw new Error(/<(!doctype|html)/i.test(t)
          ? 'The endpoint answered with a web page instead of JSON (HTTP '+status+'). '
          + 'That is almost always the deployment being set to anything other than '
          + '"Execute as: Me, Who has access: Anyone".'
          : 'The endpoint answered with something that is not JSON: '+t.slice(0,200));
      }
      if(!j.ok) throw Object.assign(new Error(j.message||j.error||'the write was refused'), {res:j});
      return j;
    })
    .catch(e=>{
      // A CORS or offline failure rejects with a bare TypeError and no detail at all,
      // so say the two things it is actually likely to be rather than echo "Failed to fetch".
      if(e instanceof TypeError) throw new Error(location.protocol==='file:'
        ? 'Opened from disk, so the browser blocks the request before sending it. '
        + 'Serve the folder and reload from http://localhost:8000/.'
        : 'Could not reach the endpoint. Either there is no network at the rig, or the '
        + 'deployment has been replaced and this URL now points at nothing — open it in '
        + 'a tab and see whether it answers.');
      throw e;
    });
}

function pingEndpoint(){
  WRSCOPE='endpoint';
  WR={busy:'ping', msg:'', tone:'', detail:''}; render();
  post('ping').then(j=>{
    const v = j.version || 1;
    const ok = v === WANT_BUILD;
    WR={busy:'', tone: ok ? 'ok' : 'warn',
        msg:'Endpoint answered — build '+v+'.',
        detail: ok ? ''
          : v < WANT_BUILD
            ? 'This page expects build '+WANT_BUILD+', so the deployment is behind it. '
            + 'Some of what the page asks for will not be there — paste the current script '
            + 'into Apps Script, then Deploy > Manage deployments > pencil > New version. '
            + 'Saving alone changes nothing the web can see, and picking an existing version '
            + 'from that list re-deploys OLD code.'
            : 'The deployment is NEWER than this page, which expects build '+WANT_BUILD+'. '
            + 'This copy of the runner is the stale one — reload it, and if that does not '
            + 'change anything, get the current page.'};
    render();
  }).catch(e=>{ WR={busy:'', tone:'bad', msg:'No.', detail:e.message}; render(); });
}

/* ── read-back ─────────────────────────────────────────────────────────────
 * A write is not done because the endpoint said so. It is done because the sheet says
 * so. Every write is followed by a read of the row it claims to have written, and only
 * that read is allowed to mark it sent.                                              */
function readRow(tab, headerRow, row, lastCol){
  const url=`https://docs.google.com/spreadsheets/d/${REGID}/gviz/tq?tqx=out:csv&sheet=`
      + encodeURIComponent(tab) + `&range=A${headerRow}:${lastCol}${row}&cb=` + Date.now();
  return fetch(url).then(r=>r.text()).then(t=>{
    if(/^\s*</.test(t)) throw new Error(
      'The write went through, but reading it back got a Google sign-in page. Set the '
      + 'registry to "Anyone with the link · Viewer" and check row '+row+' by eye.');
    const rows=csv(t);
    if(rows.length<2) throw new Error(
      'The write went through, but row '+row+' came back empty. Check it by eye.');
    return rows[rows.length-1];
  });
}
// Dates make the round trip as text and come back in whatever the cell's format says.
// Compare the digits, not the punctuation.
const sameDate = (a,b) => String(a||'').replace(/\D/g,'') === String(b||'').replace(/\D/g,'');

function loadShelf(){
  if(!REGID){ RG={rows:[],state:'unset',msg:''}; return render(); }
  RG.state='loading'; RG.msg=''; render();
  const url=`https://docs.google.com/spreadsheets/d/${REGID}/gviz/tq?tqx=out:csv&sheet=`
          + encodeURIComponent(REG_TAB) + '&range=' + REG_RANGE + '&cb=' + Date.now();
  RG.url=url;
  // RETURNS the promise: adding or retiring a ball is only finished once the shelf has
  // been read again and the change is visible in what came back.
  return fetch(url).then(r=>r.text().then(t=>({ok:r.ok,status:r.status,t})))
   .then(({ok,status,t})=>{
      if(/^\s*</.test(t)){
        RG={rows:[],state:'private',url,
            msg:'Google returned a sign-in page. The registry is not readable by link — '
              + 'set it to "Anyone with the link · Viewer".'};
        return render();
      }
      if(!ok) throw new Error('HTTP '+status);
      const num=v=>{ const x=parseFloat(String(v||'').replace(/[^0-9.\-]/g,'')); return isFinite(x)?x:0; };
      const rows=csv(t).slice(1).map(r=>({
        id:(r[REG_COL.id-1]||'').trim(),
        wear:num(r[REG_COL.wear-1]),
        otherPrior:num(r[REG_COL.otherPrior-1]),
        status:(r[REG_COL.status-1]||'').trim(),
        logged:num(r[REG_COL.logged-1]),
        age:num(r[REG_COL.age-1]),
        stage:(r[REG_COL.stage-1]||'').trim(),
        room:num(r[REG_COL.room-1]),
        paddles:num(r[REG_COL.paddles-1]),
        lastUsed:(r[REG_COL.lastUsed-1]||'').trim(),
        since:(r[REG_COL.since-1]||'').trim(),
        retiredOn:(r[REG_COL.retiredOn-1]||'').trim(),
        why:(r[REG_COL.why-1]||'').trim(),
        crackAt:(r[REG_COL.crackAt-1]||'').trim(),
        notes:(r[REG_COL.notes-1]||'').trim(),
        record:(r[REG_COL.record-1]||'').trim()
      })).filter(x=>x.id);
      RG = rows.length
        ? {rows, state:'ok', url, msg:`${rows.length} ball${rows.length===1?'':'s'} on the shelf`}
        : {rows:[], state:'empty', url,
           msg:'The registry answered but no balls came back. Check the Shelf tab still '
             + 'starts its table at row 15.'};
      // if the chosen ball is on the shelf, take its figures now
      if(RG.state==='ok' && S.ballId){ const hit=RG.rows.find(b=>b.id===S.ballId); if(hit) applyBall(hit,true); }
      render();
   })
   .catch(e=>{
      RG={rows:[], state:'fail', url,
        msg:(location.protocol==='file:'
          ? 'Opened from disk — see the red banner at the top of the page.'
          : 'Could not reach the registry: '+e.message)};
      render(); });
}

// PRIOR IMPACTS AT 50 IS "other prior" PLUS "impacts logged" — the registry keeps
// those in two columns because one is typed once and the other is counted from the
// Sessions archive. The @70 wear shots stay separate, as they do in the workbook.
function applyBall(b, quiet){
  S.ballId=b.id;
  S.prior=Math.round(b.otherPrior + b.logged);
  S.wear=b.wear;
  S.regBall=b;
  if(!quiet) render();
}
function loadPaddles(){
  PM.state='loading'; PM.msg=''; render();
  const url=`https://docs.google.com/spreadsheets/d/${PM_SHEET}/gviz/tq?tqx=out:csv&sheet=`
          + encodeURIComponent(PM_TAB) + '&cb=' + Date.now();
  PM.url=url;
  fetch(url).then(r=>r.text().then(t=>({ok:r.ok,status:r.status,t})))
   .then(({ok,status,t})=>{
      // gviz answers an unauthorised read with a Google sign-in PAGE, not an error.
      // Parsing that as CSV yields nonsense rows, so catch it explicitly.
      if(/^\s*</.test(t)){
        PM={rows:[],state:'private',url,
            msg:'Google returned a sign-in page instead of data. Paddle Metrics is not '
              + 'readable by link — gviz reads it as an anonymous visitor. Set it to '
              + '"Anyone with the link · Viewer" and try again.'};
        return render();
      }
      if(!ok) throw new Error('HTTP '+status);
      const rows=csv(t).slice(1)
        .map(r=>({name:(r[PM_COL.name-1]||'').trim(),
                  date:(r[PM_COL.date-1]||'').trim(),
                  when:pmDate(r[PM_COL.date-1]),
                  sw:parseFloat(r[PM_COL.swing-1]), len:parseFloat(r[PM_COL.length-1]),
                  mfr:(r[PM_COL.mfr-1]||'').trim(),
                  // display only — the report shows these, nothing computes from them
                  spec:{ defl:parseFloat(r[PM_COL.defl-1]), wt:parseFloat(r[PM_COL.wt-1]),
                         tw:parseFloat(r[PM_COL.tw-1]),   bp:parseFloat(r[PM_COL.bp-1]),
                         w:parseFloat(r[PM_COL.w-1]),     hl:parseFloat(r[PM_COL.hl-1]) }}))
        .filter(x=>x.name);
      PM = rows.length
        ? {rows, state:'ok', url, msg:`${rows.length} paddles`}
        : {rows:[], state:'empty', url,
           msg:'The sheet answered but no paddle names came back. Check the tab is still '
             + 'called "'+PM_TAB+'" and that column '+PM_COL.name+' holds the name.'};
      render();
   })
   .catch(e=>{
      PM={rows:[], state:'fail', url,
        msg:(location.protocol==='file:'
          ? 'This page was opened straight off the disk, so it has no origin and the '
          + 'browser refuses the request before it is even sent. Serve the folder — '
          + 'python3 -m http.server 8000 — and reload from http://localhost:8000/. '
          + 'Everything else on this page works fine from the disk.'
          : 'Could not reach Paddle Metrics: '+e.message+'. Open the CSV link below in a '
          + 'tab — if you get a sign-in page the sheet is not readable by link.')};
      render(); });
}
// Paddle Metrics dates are M-D-YYYY. Anything unparseable sorts oldest.
function pmDate(v){
  const m=String(v||'').trim().match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})/);
  return m ? new Date(+m[3], +m[1]-1, +m[2]).getTime() : 0;
}

// SOME PADDLES APPEAR TWICE, and they are retests rather than mistakes — the F+B
// Runout models and the Avoura Rivelle each have two entries months apart with
// different swing weights and different published KewCOR. Matching on name alone
// took whichever came first in the sheet, which is the OLDER measurement. Take the
// most recent entry and say so, so the choice is visible rather than silent.
function pmOptions(){
  const seen=new Set(), out=[];
  for(const r of PM.rows){ if(seen.has(r.name)) continue; seen.add(r.name);
    out.push(`<option value="${esc(r.name)}">`); }
  return out.join('');
}
function pickPaddle(i,name){
  const p=S.paddles[i]; p.name=name; p.pmNote=''; p.pmWarn='';
  const hits=PM.rows.filter(r=>r.name===name);
  if(!hits.length){ render(); return; }
  const hit=hits.slice().sort((a,b)=>b.when-a.when)[0];
  if(isFinite(hit.sw)) p.sw=hit.sw; else p.pmWarn='no swing weight on file — type it';
  if(isFinite(hit.len)) p.len=hit.len;
  else p.pmWarn=(p.pmWarn?p.pmWarn+'; ':'')+'no length on file — type it';
  p.mfr=hit.mfr||'';
  // Display-only specs for the client report. Taken from the SAME Paddle Metrics row the
  // length and swing weight came from, so a report can never mix one measurement's swing
  // weight with another's deflection.
  p.spec=Object.assign({}, hit.spec);
  if(hits.length>1){
    const older=hits.filter(h=>h!==hit).map(h=>h.date||'undated').join(', ');
    p.pmNote=`${hits.length} entries for this name — using the ${hit.date||'undated'} `
           + `measurement. Older: ${older}.`;
  }
  render();
}

/* ── parsing, and the shape of the session ────────────────────────────────── */
function parseShots(txt){
  return String(txt||'').split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map(line=>{
    const p=line.split(/[\t,;]+|\s+/).map(x=>x.trim()).filter(x=>x!=='').map(Number);
    return {vin:p[0], vout:p[1], gateCor:p.length>2?p[2]:null};
  }).filter(s=>isFinite(s.vin));
}
const A = () => K.ANCHORS[S.anchor];
/* PRE, MID and POST are all shot at the crosshair, so they use the fixture's own Q.
   The weekly control block is NOT — it is 6 in from the tip, which is a different
   pivot-to-impact distance and therefore a different effective mass. On Anchor 2 the two
   differ by 54%. Passing the crosshair's q for that block would not fail, it would just
   be wrong, which is worse. */
const ctrlBlock = (txt, qIn) => K.summarize(parseShots(txt), A().swingWt,
                                            qIn == null ? K.controlQ() : qIn);
const controlSpotQ = () => K.qForLocation(A().length, +S.controlSpot || K.C.controlSpot);
const controlBlock = () => ctrlBlock(S.mirror, controlSpotQ());
const effAge = () => K.effectiveAge(parseFloat(S.prior)||0, parseFloat(S.wear)||0);
const locsFor = p => p.use7 ? LOC_ALL : LOC_ALL.slice(0,4);
const groupsFor = p => locsFor(p).map(l=>parseShots(p.shots[l]||''));
const STD_RUN = K.C.perLoc * 4;
function paddleShotCounts(){
  return S.paddles.map(p=>{
    const n=groupsFor(p).reduce((a,g)=>a+g.length,0);
    return n || (p.name ? (p.use7?STD_RUN+K.C.perLoc:STD_RUN) : 0);
  });
}
function timeline(){
  const pre=ctrlBlock(S.pre), post=ctrlBlock(S.post), mid=ctrlBlock(S.mid);
  return K.ballTimeline({prior:parseFloat(S.prior)||0, wearShots:parseFloat(S.wear)||0,
    preFired:pre.fired, midFired:mid.fired, postFired:post.fired,
    paddleShots:paddleShotCounts(), midAfterPaddle:mid.fired?S.midAfter:0});
}

/* ── little builders ──────────────────────────────────────────────────────── */
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const f = (v,d=4) => v==null||!isFinite(v) ? '—' : (+v).toFixed(d);
const ib_ = k => `<button class="i" onclick="bubble('${k}')" title="Explain">i</button>`;
function field(lbl,key,type,note,attrs){
  const num = type==='number';
  return `<div><label>${lbl}${note?ib_(note):''}</label>
    <input id="f-${key}" ${attrs||''} type="text" ${num?'inputmode="decimal" autocomplete="off"':''}
      value="${esc(S[key])}" oninput="S['${key}']=this.value;render()"></div>`;
}
function pfield(i,lbl,k,attrs){
  return `<div><label>${lbl}</label><input id="p${i}-${k}" type="text" inputmode="decimal"
    autocomplete="off" ${attrs||''} value="${esc(S.paddles[i][k])}"
    oninput="S.paddles[${i}]['${k}']=this.value;render()"></div>`;
}
function shotTable(sum){
  if(!sum.rows.length) return '<p class="muted">Nothing pasted yet.</p>';
  const cls={'USE':'s-use','REJECT vel':'s-rej','MISSING Vout':'s-bad','PASTE MISALIGNED':'s-bad'};
  return `<table><thead><tr><th>#</th><th>Inbound</th><th>Outbound</th><th>Gate COR</th>
    <th>PBCoR raw</th><th>PBCoR @50</th><th>Status</th></tr></thead><tbody>`+
    sum.rows.map((r,i)=>`<tr class="${r.status==='USE'?'':(r.status==='REJECT vel'?'rej':'bad')}">
      <td>${i+1}</td><td>${f(r.vin,2)}</td><td>${f(r.vout,2)}</td><td>${f(r.gateCor,3)}</td>
      <td>${f(r.pRaw)}</td><td>${f(r.p50)}</td>
      <td><span class="status ${cls[r.status]||''}">${r.status}</span></td></tr>`).join('')+
    `</tbody></table>`;
}
function ctrlPanel(sum,title){
  return `<div class="card"><h3>${title}</h3><div class="kpi">
    <div><b>${sum.n}</b><span>shots used</span></div>
    <div><b>${sum.fired}</b><span>fired</span></div>
    <div><b>${f(sum.meanVin,1)}</b><span>mean inbound</span></div>
    <div><b>${f(sum.mean)}</b><span>P_ctrl @50</span></div>
    <div><b>${f(sum.se)}</b><span>se</span></div>
    <div><b>${f(K.D(A().pRef,sum.mean),5)}</b><span>D</span></div></div></div>`;
}
const NOSORT = `<div class="banner b-warn"><b>DO NOT SORT.</b>
  Paste in the order you fired, bad shots included. Every location is corrected at the
  moment its block was actually shot, so a sorted paste is silently wrong — the numbers
  still look reasonable.${ib_('paste')}</div>`;

// Sits directly under DO NOT SORT. Blue rather than amber on purpose: this one is
// reassurance, not a warning — a shot outside the window is normal and expected, and
// the point is that you paste it anyway rather than tidying it away.
const WINDOW_NOTE = n => `<div class="banner b-ok"><div>` +
  `<b>The window is ${K.C.target} ± ${K.C.window} mph ` +
  `(${K.C.target - K.C.window} to ${K.C.target + K.C.window}).</b>` + `
  Anything outside it is marked REJECT vel and left out of the average — but
  <b>paste all ${n} shots regardless</b>. A rejected shot still hit the ball, so it still
  counts toward wear, and dropping it before you paste makes the ball look younger than
  it is. Expect to lose about one in ten.${ib_('window')}</div></div>`;

/* ── the two rows ──────────────────────────────────────────────────────────
 * Six decimals. Past anything either tab displays, short of float noise, and the same
 * numbers go to the clipboard and to the wire — built here once so they cannot differ.
 * Empty means empty: a session with no MID block sends nothing for those columns rather
 * than a zero, because zero is a measurement and blank is not.                        */
const n6 = v => (v==null || !isFinite(v)) ? '' : Math.round(v*1e6)/1e6;
const numOrBlank = v => (v===''||v==null||!isFinite(+v)) ? '' : +v;

function sessionRowValues(){
  const pre=ctrlBlock(S.pre), post=ctrlBlock(S.post), mid=ctrlBlock(S.mid), tl=timeline();
  const fired = pre.fired + post.fired + mid.fired
              + paddleShotCounts().reduce((a,b)=>a+b,0);
  return [
    S.date, S.ballId, S.anchor, numOrBlank(S.temp),
    pre.n||'',  pre.n?n6(pre.mean):'',  pre.n?n6(pre.se):'',
    post.n||'', post.n?n6(post.mean):'', post.n?n6(post.se):'',
    n6(K.pooledD(A().pRef, pre, post.n?post:null)),
    Math.round(tl.ageAfter), fired,
    mid.n||'',  mid.n?n6(mid.mean):'',  mid.n?n6(mid.se):'',
    mid.n?Math.round(tl.ageMid):'',
    'LIVE'
  ];
}

/* Column K is the sheet's own crosshair-minus-mirror and column L is cumulative anchor
   hits, which this page has no way to know — both are left out rather than guessed at.
   The crosshair block is the PRE block; it is never typed twice. */
function anchorRowValues(){
  const pre=ctrlBlock(S.pre), mir=controlBlock();
  return [
    S.date, S.anchor, numOrBlank(S.deflection), numOrBlank(S.temp),
    mir.n||'', mir.n?n6(mir.mean):'', mir.n?n6(mir.se):'',
    pre.n||'', pre.n?n6(pre.mean):'', pre.n?n6(pre.se):'',
    '', '',
    S.ballId, S.person ? ('logged by '+S.person) : '',
    // Column O. Without it a change of spot is invisible in the record and the tilt line
    // would go on subtracting readings taken at different places on the face.
    mir.n ? (+S.controlSpot || K.C.controlSpot) : ''
  ];
}
const anchorHasSomething = () =>
  S.deflection!=='' || controlBlock().n || ctrlBlock(S.pre).n;

/* ── the writes ────────────────────────────────────────────────────────────
 * Each one is: post, read the row back, and only then say it is done. The read is the
 * part that matters. An endpoint that answers {ok:true} is telling you what it believes;
 * the sheet is the only thing that can tell you what happened.                        */
function needRegistry(){
  if(REGID) return false;
  WR={busy:'', tone:'bad', msg:'The registry is not connected — nothing was sent.',
      detail:'This is a setting on this machine, not a problem with the network or the '
           + 'endpoint, and nothing you do on this screen will fix it. Go to the Ball '
           + 'registry tab, paste the registry\'s Google Sheets URL, then come back and '
           + 'send. The write goes through the endpoint, but reading it back to confirm '
           + 'goes through the sheet, so without the sheet there is no confirmation and '
           + 'the send is refused rather than left unverified.'};
  render(); return true;
}
function wrFail(e){
  const dup = e.res && e.res.error==='duplicate';
  const stale = e.res && e.res.error==='stale';
  WR={busy:'', tone: dup?'warn':'bad', dup:!!dup, stale:!!stale,
      msg: dup ? 'Already logged.' : stale ? 'The shelf moved under you.' : 'It did not go.',
      detail: e.message};
  render();
}

function sendSession(allowDuplicate){
  WRSCOPE='session';
  if(needRegistry()) return;
  const row=sessionRowValues();
  WR={busy:'session', msg:'', tone:'', detail:''}; render();
  post('session', {row, allowDuplicate: !!allowDuplicate})
    .then(j=>readRow('Sessions', 5, j.row, 'B').then(back=>({j, back})))
    .then(({j, back})=>{
      if(!sameDate(back[0], row[0]) || String(back[1]||'').trim() !== String(row[1]).trim())
        throw new Error('The endpoint said row '+j.row+', but that row reads "'
          + back[0]+' / '+back[1]+'" instead of "'+row[0]+' / '+row[1]+'". Something else '
          + 'is writing to this tab. Open the registry and look before sending again.');
      S.sent.session={row:j.row, date:row[0], ball:row[1]};
      WR={busy:'', tone:'ok', msg:'Logged to Sessions row '+j.row+' — and read back.',
          detail: refusedNote(j)};
      loadShelf();
    })
    .catch(wrFail);
}

function sendAnchor(){
  WRSCOPE='anchor';
  if(needRegistry()) return;
  if(!anchorHasSomething()){
    WR={busy:'', tone:'warn', msg:'Nothing to log yet.',
        detail:'An anchor row needs at least a deflection reading. Take one before the '
             + 'first shot — it costs a minute and no ball life.'};
    return render();
  }
  const row=anchorRowValues();
  WR={busy:'anchor', msg:'', tone:'', detail:''}; render();
  post('anchor', {row})
    .then(j=>readRow('Anchors', 31, j.row, 'C').then(back=>({j, back})))
    .then(({j, back})=>{
      if(!sameDate(back[0], row[0]) || String(back[1]||'').trim() !== String(row[1]).trim())
        throw new Error('The endpoint said row '+j.row+', but that row reads "'
          + back[0]+' / '+back[1]+'". Open the registry and look before sending again.');
      S.sent.anchor={row:j.row, date:row[0], anchor:row[1]};
      WR={busy:'', tone:'ok',
          msg:(j.created===false
                ? 'Updated today\'s Anchors row, row '+j.row
                : 'Logged to Anchors row '+j.row) + ' — and read back.',
          detail: (j.created===false
            ? 'Same date, same anchor, so it went into the reading you started this '
            + 'morning rather than a second row. '
            : '') + refusedNote(j)};
      render();
    })
    .catch(wrFail);
}
const refusedNote = j => (j.refused && j.refused.length)
  ? 'The endpoint refused columns '+j.refused.join(', ')+'. Those are formulas and were '
  + 'left alone, which is the allow-list doing its job — but it also means this page sent '
  + 'something it should not have. Worth reporting.'
  : '';

/* ── the shelf, written to ─────────────────────────────────────────────── */
let NB={id:'', since:new Date().toISOString().slice(0,10), wear:'', otherPrior:'', status:'IN ROTATION'};
let RB={id:'', status:'RETIRED', why:'', retiredOn:new Date().toISOString().slice(0,10),
        crackAt:'', notes:''};

function addBall(){
  WRSCOPE='shelf';
  if(needRegistry()) return;
  const id=(NB.id||'').trim();
  if(!id){ WR={busy:'',tone:'warn',msg:'It needs an ID.',detail:''}; return render(); }
  if(RG.rows.some(b=>b.id.toLowerCase()===id.toLowerCase())){
    WR={busy:'',tone:'warn',msg:id+' is already on the shelf.',
        detail:'A ball is never added twice and never deleted — if it came back from '
             + 'somewhere, change its status instead.'};
    return render();
  }
  WR={busy:'addBall', msg:'', tone:'', detail:''}; render();
  post('addBall', {id, since:NB.since, wear:numOrBlank(NB.wear),
                   otherPrior:numOrBlank(NB.otherPrior), status:NB.status})
    .then(j=>loadShelf().then(()=>j))
    .then(j=>{
      const back=RG.rows.find(b=>b.id===id);
      if(!back) throw new Error('The endpoint wrote row '+j.row+', but the ball is not on '
        + 'the shelf when it is read back. Open the registry and look at row '+j.row+'.');
      NB={id:'', since:new Date().toISOString().slice(0,10), wear:'', otherPrior:'', status:'IN ROTATION'};
      WR={busy:'', tone:'ok', msg:id+' is on the shelf at row '+j.row+' — and read back.',
          detail:'Effective age '+Math.round(back.age)+', stage '+(back.stage||'—')+'. '
               + refusedNote(j)};
      render();
    })
    .catch(wrFail);
}

/* The two guards here are the registry's own, moved forward. Its check column says
   "RETIRED WITHOUT A REASON" and "SEAM CRACK with no impact count", and a form that can
   only produce a red cell is a form that should have said no. */
function retireBall(){
  WRSCOPE='shelf';
  if(needRegistry()) return;
  const b=RG.rows.find(x=>x.id===RB.id);
  if(!b){ WR={busy:'',tone:'warn',msg:'Pick a ball.',detail:''}; return render(); }
  if(!RB.why){ WR={busy:'',tone:'warn',msg:'It needs a reason.',
      detail:'The registry flags a ball taken out of service with no reason, because in '
           + 'six months the reason is the only part anybody wants.'}; return render(); }
  if(RB.why==='SEAM CRACK' && numOrBlank(RB.crackAt)===''){
    WR={busy:'',tone:'warn',msg:'A seam crack needs the impact count.',
        detail:'It is the one number the crack-rate line on the Degradation tab is '
             + 'built from. Effective age right now is '+Math.round(b.age)+'.'};
    return render();
  }
  WR={busy:'retire', msg:'', tone:'', detail:''}; render();
  post('setBall', {id:b.id, expectedStatus:b.status, status:RB.status,
                   retiredOn:RB.retiredOn, why:RB.why,
                   crackAt:numOrBlank(RB.crackAt), notes:RB.notes})
    .then(j=>loadShelf().then(()=>j))
    .then(j=>{
      const back=RG.rows.find(x=>x.id===b.id);
      if(!back) throw new Error('Wrote row '+j.row+', but '+b.id+' is not on the shelf when '
        + 'it is read back. Open the registry and look.');
      if(back.status!==RB.status) throw new Error('Wrote row '+j.row+', but '+b.id+' still '
        + 'reads "'+back.status+'" rather than "'+RB.status+'". Look at row '+j.row+'.');
      WR={busy:'', tone:'ok',
          msg:b.id+' is '+RB.status+' — '+j.from+' → '+j.to+', row '+j.row+', read back.',
          detail:'It keeps its whole history and stops being offered for a session. '
               + refusedNote(j)};
      RB={id:'', status:'RETIRED', why:'', retiredOn:new Date().toISOString().slice(0,10),
          crackAt:'', notes:''};
      render();
    })
    .catch(wrFail);
}

/* ── what the last write did ───────────────────────────────────────────────
 * One banner, rendered where the write was asked for and nowhere else. It carries the
 * row number, because the row number is what you would use to go and look — and being
 * able to go and look is the whole point of reading a write back rather than trusting
 * the reply that says it worked.                                                     */
let WRSCOPE='', SHOWSEC=false;
function wrBanner(scope){
  if(scope && WRSCOPE!==scope) return '';
  if(WR.busy) return `<div class="banner b-mute"><div>Sending…</div></div>`;
  if(!WR.msg) return '';
  const cls = WR.tone==='ok'?'b-ok':WR.tone==='warn'?'b-warn':WR.tone==='bad'?'b-bad':'b-mute';
  return `<div class="banner ${cls}"><div><b>${esc(WR.msg)}</b>
    ${WR.detail?' '+esc(WR.detail):''}
    ${WR.dup?`<div class="row" style="margin-top:8px">
      <button class="ghost" onclick="sendSession(true)">Log it anyway — this is a second session today</button>
      </div>`:''}
    ${WR.stale?`<div class="row" style="margin-top:8px">
      <button class="ghost" onclick="loadShelf()">Re-read the shelf</button></div>`:''}
    </div></div>`;
}

/* The weekly one. Ten shots at the mirror-image point, in the same session as the
   control blocks, so ball, temperature and cannon all cancel in the difference. The
   crosshair half of that difference is the PRE block — never shot or typed twice. */
function controlCard(){
  const ctl=controlBlock(), pre=ctrlBlock(S.pre);
  const gap = (ctl.n && pre.n) ? pre.mean - ctl.mean : null;
  const spot = +S.controlSpot || K.C.controlSpot;
  return `<div class="card"><h3>Control spot — weekly ${ib_('control')}</h3>
    <p class="muted" style="margin-top:-6px">First session of the week only. Ten shots at the
      control spot, in the same session as the blocks above so ball, temperature and cannon
      all cancel in the difference. Leave it empty the rest of the week.</p>
    <div class="grid" style="margin-bottom:10px">
      <div><label>Spot (in from tip)</label>
        <select id="f-controlSpot" onchange="S.controlSpot=+this.value;render()">
          ${[3,5,6].map(v=>`<option value="${v}" ${v===spot?'selected':''}>${v} in</option>`).join('')}
        </select></div>
      <div><label>Pivot to impact</label><div class="out">${controlSpotQ().toFixed(2)} in
        <span class="muted">vs ${K.controlQ().toFixed(2)} at the crosshair</span></div></div>
    </div>
    ${spot!==K.C.controlSpot?`<div class="banner b-bad"><div>
      <b>This is not the spot the series was built on.</b> The settled spot is
      ${K.C.controlSpot} in. A different distance from the tip has a different effective
      mass and a different intrinsic PBCoR, so switching puts a step of roughly 0.02 into
      the trend — four times the drift that matters. Change it only deliberately, and
      expect the tilt line to be meaningless until four readings exist at the new spot.</div></div>`:''}
    <textarea id="t-mirror" class="paste" style="min-height:88px"
      placeholder="ten shots at ${spot} in — Inbound  Outbound  COR"
      oninput="S.mirror=this.value;render()">${esc(S.mirror)}</textarea>
    ${ctl.n?`<div class="kpi" style="margin-top:10px">
      <div><b>${ctl.n}</b><span>used</span></div>
      <div><b>${f(ctl.mean)}</b><span>P control</span></div>
      <div><b>${f(ctl.se)}</b><span>se</span></div>
      ${gap!=null?`<div><b>${f(gap,4)}</b><span>crosshair − control</span></div>`:''}
    </div>
    ${gap!=null?`<div class="banner b-mute" style="margin:10px 0 0"><div>
      <b>That gap is not a wear figure on its own.</b> The two spots are at different

      at this spot exist. One number here tells you nothing; the series does.</div></div>`:''}`
    :''}</div>`;
}

// The registry's own effective age is recomputed from the two figures we pulled. If
// they disagree the pull is stale or a column has moved — say so rather than quietly
// running on numbers that do not add up. The workbook carries the same guard.
function ballGuard(){
  const b=S.regBall; if(!b || RG.state!=='ok') return '';
  const onFile = Math.round(b.otherPrior + b.logged), wearOnFile = Math.round(b.wear);
  const mine = K.effectiveAge(+S.prior||0, +S.wear||0);
  const differs = Math.round(+S.prior||0) !== onFile || Math.round(+S.wear||0) !== wearOnFile;
  // One condition, one banner. Typing over the boxes and disagreeing with the registry
  // are the same event, and splitting them meant the more useful message could hide
  // behind the less useful one.
  if(differs) return `<div class="banner b-bad"><div>` +
    `<b>PRIOR IMPACTS DISAGREES.</b> ` +
    `The boxes say ${Math.round(+S.prior||0)} at 50 and ${Math.round(+S.wear||0)} wear shots, ` +
    `which works out at ${Math.round(mine)} effective impacts. ` +
    `The registry says ${onFile} and ${wearOnFile}, i.e. ${Math.round(b.age)}. ` +
    `Believe the registry — re-pick ${esc(b.id)} to put it back.</div></div>`;
  return `<div class="banner b-ok"><div>` +
    `<b>${esc(b.id)} — straight from the registry.</b> ` +
    `${onFile} impacts at 50 plus ${wearOnFile} wear shots at 70. ` +
    `Stage ${esc(b.stage||'—')}, ${Math.round(b.room)} left before it retires, ` +
    `room for about ${Math.round(b.paddles)} more paddle${b.paddles===1?'':'s'}.` +
    `${b.lastUsed?` Last used ${esc(b.lastUsed)}.`:''}</div></div>`;
}

function scControl(which){
  const key = which==='PRE'?'pre':which==='MID'?'mid':'post';
  const sum = ctrlBlock(S[key]);
  const age=effAge(), planned=paddleShotCounts().reduce((x,y)=>x+y,0);
  const adv = which==='MID' ? K.midAdvice(age,planned) : null;
  let verdict='';
  if(which==='POST'){
    const pre=ctrlBlock(S.pre);
    if(pre.n && sum.n){
      const dm=K.driftMode({pre,post:sum});
      verdict=`<div class="banner ${dm.ramp?'b-warn':'b-ok'}"><b>${dm.mode}</b> —
        P_post − P_pre = ${f(dm.diff)} ± ${f(dm.sed)}, t = ${f(dm.t,2)}.
        ${dm.ramp?'The ball moved. Each paddle, and each location block, is corrected at its own point on the wear curve.'
                 :'The ball did not move enough to distinguish the paddles; one correction is used for the whole session.'}
        ${ib_('drift')}</div>`;
    }
  }
  return `<h2>${which} ball correction</h2>
  <p class="lede">${which==='MID'?'Between paddles 2 and 3, if the sheet asked for it.'
      :which==='PRE'?'Before the first paddle.':'After the last paddle.'}
    Ten shots at the control paddle, at the crosshair. Never move the paddle to change aim.</p>
  ${S.endedEarly&&which==='POST'?`<div class="banner b-ok"><b>Session ended after two paddles.</b>
     The MID block you shot has become the POST block — nothing was wasted.</div>`:''}
  ${adv?`<div class="banner ${adv.verdict==='SHOOT IT'?'b-warn':'b-mute'}"><b>${adv.verdict}.</b> ${adv.why}</div>`:''}
  ${verdict}${NOSORT}${WINDOW_NOTE('ten')}
  <div class="card"><h3>Paste the gate dump</h3>
    <textarea id="t-${key}" class="paste" placeholder="Inbound  Outbound  COR&#10;49.8  12.1  0.243"
      oninput="S['${key}']=this.value;render()">${esc(S[key])}</textarea>
    <p class="muted" style="margin-bottom:0">Rejected shots stay in — the ball felt them.${ib_('window')}</p></div>
  ${sum.n?ctrlPanel(sum,which+' summary'):''}
  <div class="card"><h3>Shots</h3>${shotTable(sum)}</div>
  ${which==='PRE'?controlCard():''}
  ${which==='MID'&&sum.n?`<div class="row"><button class="ghost" onclick="endEarly()">End the session here →</button>
     <span class="muted">Turns this block into the POST block and skips paddles 3 and 4.</span></div>`:''}
  <div class="row"><button class="ghost" onclick="go(S.step-1)">← Back</button>
    <button onclick="go(S.step+1)">Next →</button></div>`;
}
function endEarly(){
  if(!confirm('End the session after two paddles?\n\nThe MID block becomes the POST block, and paddles 3 and 4 are dropped.')) return;
  S.post=S.mid; S.mid=''; S.midAfter=0; S.endedEarly=true;
  S.paddles=S.paddles.slice(0,2);
  go(7);
}

function paddleResults(idx){
  const p=S.paddles[idx]; if(!p||!p.name) return null;
  const len=parseFloat(p.len), sw=parseFloat(p.sw); if(!(len>0&&sw>0)) return null;
  const pre=ctrlBlock(S.pre); if(!pre.n) return null;
  const post=ctrlBlock(S.post), mid=ctrlBlock(S.mid);
  const tl=timeline();
  const dm=K.driftMode({pre,post:post.n?post:null});
  const pooled=K.pooledD(A().pRef,pre,post.n?post:null);
  const locs=locsFor(p), groups=groupsFor(p);
  if(!groups.some(g=>g.length)) return null;
  const bD=K.blockCorrections({slot:idx, tl,
    dPre:K.D(A().pRef,pre.mean),
    dMid:mid.n?K.D(A().pRef,mid.mean):null,
    dPost:post.n?K.D(A().pRef,post.mean):null,
    ramp:dm.ramp, pooled, nLocations:locs.length,
    blockCounts:groups.map(g=>g.length)});
  const res=K.locationResults(groups,len,sw,locs,bD);
  return {res, summary:K.faceSummary(res), dm, bD};
}

/* The window is 0.07 — the span the KewCOR curve uses on the site — centered on this
   paddle's own values. Wider than that and it opens to fit, with 0.01 of headroom. */
function axisFor(vals){
  const WIN=0.07, lo=Math.min(...vals), hi=Math.max(...vals), span=hi-lo;
  if(span<=WIN){ const c=(lo+hi)/2; return {lo:c-WIN/2, hi:c+WIN/2, fitted:true}; }
  return {lo:lo-0.01, hi:hi+0.01, fitted:false};
}
function faceChart(res){
  const live=res.filter(r=>r.kewcor!=null); if(live.length<2) return '';
  const ax=axisFor(live.map(r=>r.kewcor));
  const W=620,H=250,PL=54,PR=18,PT=20,PB=38;
  const xs=live.map(r=>r.location), x0=Math.min(...xs)-0.5, x1=Math.max(...xs)+0.5;
  const X=v=>PL+(v-x0)/(x1-x0)*(W-PL-PR), Y=v=>PT+(ax.hi-v)/(ax.hi-ax.lo)*(H-PT-PB);
  const pts=live.map(r=>[X(r.location),Y(r.kewcor)]);
  let d=`M${pts[0][0]},${pts[0][1]}`;
  for(let i=0;i<pts.length-1;i++){
    const p0=pts[i-1]||pts[i], p1=pts[i], p2=pts[i+1], p3=pts[i+2]||p2;
    d+=` C${p1[0]+(p2[0]-p0[0])/6},${p1[1]+(p2[1]-p0[1])/6} ${p2[0]-(p3[0]-p1[0])/6},${p2[1]-(p3[1]-p1[1])/6} ${p2[0]},${p2[1]}`;
  }
  const step=(ax.hi-ax.lo)/7; let g='';
  for(let i=0;i<=7;i++){ const v=ax.lo+i*step;
    g+=`<line x1="${PL}" y1="${Y(v)}" x2="${W-PR}" y2="${Y(v)}" stroke="#eef1f6"/>
        <text x="${PL-7}" y="${Y(v)+4}" text-anchor="end" font-size="10" fill="#6b7280">${v.toFixed(3)}</text>`; }
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${W}px">${g}
    ${live.map(r=>`<text x="${X(r.location)}" y="${H-PB+16}" text-anchor="middle" font-size="11" fill="#6b7280">${r.location}</text>`).join('')}
    <path d="${d}" fill="none" stroke="#1f3864" stroke-width="2.4"/>
    ${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="5" fill="#1f3864"/>
      <text x="${p[0]}" y="${p[1]-11}" text-anchor="middle" font-size="11" font-weight="600" fill="#1f3864">${live[i].kewcor.toFixed(3)}</text>`).join('')}
    <text x="${(W-PL)/2+PL}" y="${H-4}" text-anchor="middle" font-size="11" fill="#4b5563">Impact location (in from tip)</text>
    </svg><p class="muted" style="margin:2px 0 0">Vertical span ${(ax.hi-ax.lo).toFixed(3)}${
      ax.fitted?', the standard 0.07 window centered on this paddle':' — wider than 0.07, opened to fit'}${ib_('axis')}</p>`;
}

function copyRow(btn){
  const t=document.getElementById('sessrow');
  navigator.clipboard.writeText(t.value).then(()=>{ btn.textContent='Copied'; setTimeout(()=>{btn.textContent='Copy row';},1400); });
}

/* ── the shelf ─────────────────────────────────────────────────────────────
 * The same app as the session on purpose. Putting a ball into service and taking it out
 * are the first and last things that happen to it, the session is everything in
 * between, and splitting that across two tools would mean the one place the ball's life
 * is written down is the one place you are not standing.                              */
function shelfTable(){
  const rows=RG.rows;

  return `<div class="card"><h3>On the shelf</h3>
  <div style="overflow-x:auto"><table>

      <th>Other prior</th><th>Logged</th><th>Effective age</th><th>Stage</th>
      <th>Room</th><th>Paddles</th><th>Last used</th><th class="l">How it ended</th></tr></thead>
    <tbody>${rows.map(b=>{
      const dead = b.status==='RETIRED'||b.status==='CRACKED';
      return `<tr class="${dead?'dim':''}">
        <td class="l"><b>${esc(b.id)}</b></td>
        <td><span class="pill ${b.status==='IN ROTATION'?'use':dead?'bad':'warn'}">${
          esc(b.status||'—')}</span></td>
        <td>${esc(b.since||'—')}</td><td>${b.wear||0}</td><td>${b.otherPrior||0}</td>
        <td>${b.logged||0}</td><td><b>${Math.round(b.age)}</b></td>

    }).join('')}</tbody></table></div>
  ${noReason.length?`<div class="banner b-warn" style="margin:12px 0 0"><div>
    <b>${noReason.map(b=>esc(b.id)).join(', ')} came out of service with no reason recorded.</b>
    The registry flags those too. In six months the reason is the only part anybody wants —
    fill it in on the Shelf tab, or retire it again below to write it properly.</div></div>`:''}
  <p class="muted" style="margin-bottom:0">A ball is never deleted. It is set to RETIRED or

}

        value="${esc(RB.crackAt)}" placeholder="${b?Math.round(b.age):''}"
        ${RB.why==='SEAM CRACK'?'':'disabled'} oninput="RB.crackAt=this.value;render()"></div>
      <div style="grid-column:span 2"><label>Notes</label><input id="rb-notes"
        value="${esc(RB.notes)}" oninput="RB.notes=this.value;render()"></div>
    </div>
    ${RB.why==='SEAM CRACK'?`<div class="banner b-warn" style="margin:11px 0 0"><div>
      <b>A seam crack needs the impact count.</b> It is the one number the crack-rate line on the
      Degradation tab is built from.${b?` This ball is at ${Math.round(b.age)} effective impacts
      right now — use that unless you know when it actually went.`:''}</div></div>`:''}
    ${RB.status==='CRACKED'?`<div class="banner b-mute"><div>CRACKED rather than RETIRED says the
      ball failed rather than wore out. The distinction is what the crack rate is counted from,
      so it is worth getting right even when the practical effect is the same.</div></div>`:''}
    <div class="row"><button ${ready&&RB.id?'':'disabled'} onclick="retireBall()">
      Take it out of service</button>
      ${b?`<span class="muted">${esc(b.id)} is "${esc(b.status)}" on the shelf now.
        ${b.lastUsed?'Last used '+esc(b.lastUsed)+'.':''}</span>`:''}
    </div>${wrBanner('shelf')}</div>`;
}

function scRegistry(){
  return `<h2>Ball registry</h2>
  <p class="lede">The shelf: what is on it, what goes onto it, and what comes off.</p>
  ${endpointPanel()}
  <div class="card"><h3>The registry sheet</h3>${regPanel()}
    <p class="muted" style="margin-bottom:0">Reading is done straight off the sheet, so the
      registry has to be shared "Anyone with the link · Viewer". Writing goes through the
      endpoint above, which is what keeps the formulas out of reach.</p></div>
  ${RG.state==='ok'?shelfTable():''}
  ${addBallCard()}
  ${retireCard()}`;
}

/* OPENED FROM DISK. Nothing that leaves this machine can work — not the paddle list,
 * not the registry, not one of the four writes — because a file:// page has a null
 * origin and the browser refuses the request before it is sent.
 *
 * Each of those already explained itself where it failed, which was the mistake: you
 * only met the explanation after doing the work that could not succeed. Pasting a
 * registry URL into a page that cannot fetch anything is a wasted step, and the page
 * knew that before the URL was typed. So it says so once, at the top, before anything
 * asks you for something.                                                            */
function fileBanner(){
  if(location.protocol!=='file:') return '';
  return `<div class="banner b-bad"><div>
    <b>This page was opened from disk, so nothing can reach the network.</b>
    The paddle list, the ball registry and all four writes are blocked by the browser
    before the request is even sent — a file:// page has no origin Google will answer.
    Nothing here is broken; it is in the wrong place.
    <div style="margin:9px 0 4px"><b>Serve the folder and load it over http instead:</b></div>
    <div style="background:rgba(255,255,255,.55);border-radius:6px;padding:9px 11px;
      font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;
      overflow-x:auto;white-space:pre">cd "…/Work/KewCOR/web"
python3 -m http.server 8000</div>
    <div style="margin-top:7px">Then open
      <b>http://localhost:8000/kewcor-session.html</b> and leave the terminal running.
      Everything you have typed is saved in this browser and will still be here.</div>
    </div></div>`;
}

function setMode(m){ S.mode=m; WR={busy:'',msg:'',tone:'',detail:''}; window.scrollTo(0,0); render(); }

/* ── the client report ─────────────────────────────────────────────────────
 * One paddle, one report, one link. The payload is only what the report DISPLAYS —
 * see the note on encodeReport — and it is built here rather than on the report page
 * because everything it needs is session state, and because the DRAFT stamp is a fact
 * about the session that the report page has no way to work out for itself.
 *
 * A report is a SNAPSHOT. Nothing is stored, so re-issuing gives you a second link
 * rather than updating the first. For a document you hand to somebody else that is the
 * safer direction — a report that changed after it was sent would be worse — but it is
 * a real property and the button says so.                                            */
function reportPayload(idx){
  const p=S.paddles[idx], R=paddleResults(idx);
  if(!R || !R.summary) return null;
  const post=ctrlBlock(S.post);
  const num = v => { const x=parseFloat(v); return isFinite(x) ? Math.round(x*1e4)/1e4 : null; };
  /* WHY THIS ONE IS NOT FINISHED, in the words the workbook uses. Empty means complete.
     There is no "no PRE block" case here: without one there is no correction and so no
     KewCOR at all, paddleResults returns null above, and no report button is drawn. A
     branch for it would be a branch that can never run, which reads like a handled case
     and is not one. */
  const draft = !post.n
    ? 'the POST ball correction has not been shot, so the ball correction is not final'
    : !S.sent.session ? 'this session has not been logged to the registry' : '';
  const sp=p.spec||{};
  return {
    v:1, d:S.date, m:p.name, mfr:p.mfr||'', p:S.person||'', t:S.temp===''?null:+S.temp,
    b:S.ballId, a:S.anchor, tg:K.C.target,
    n:R.res.reduce((a,r)=>a+r.fired,0),
    sp:{ sw:num(p.sw), len:num(p.len), wt:num(sp.wt), tw:num(sp.tw),
         w:num(sp.w), hl:num(sp.hl), defl:num(sp.defl), bp:num(sp.bp) },
    r:R.res.map(x=>[x.location, x.kewcor==null?null:Math.round(x.kewcor*1e4)/1e4]),
    sum:{ peak:R.summary.peakLocation, max:Math.round(R.summary.max*1e4)/1e4,
          var:Math.round(R.summary.variance*1e4)/1e4, band:R.summary.band },
    draft, iss:S.date
  };
}
function reportUrl(idx){
  const o=reportPayload(idx);
  if(!o) return '';
  // RELATIVE, so the link is right wherever the pair is served from — localhost while
  // you are testing, github.io once published — without either page knowing its own home.
  return new URL('kewcor-report.html', location.href).href + '#' + K.encodeReport(o);
}
function openReport(idx){
  const u=reportUrl(idx);
  if(u) window.open(u, '_blank', 'noopener');
}
function copyReport(idx, btn){
  const u=reportUrl(idx);
  if(!u) return;
  navigator.clipboard.writeText(u).then(
    ()=>{ btn.textContent='Link copied'; setTimeout(()=>{btn.textContent='Copy the link';},1600); },
    ()=>{ btn.textContent='Could not copy'; });
}

/* ── the per-paddle archive ────────────────────────────────────────────────
 * The internal record, one Google Sheet per paddle, built out of FORMULAS so that a
 * spec corrected months later still flows through to the results. What travels is the
 * raw material: every shot as it came off the gate, the paddle's specs, and the ball
 * correction that was in force. The sheet does the arithmetic itself.
 *
 * It also carries the KewCOR this page computed, per location, so the sheet can put its
 * own recomputed figure beside it and say whether they agree. Two implementations of the
 * same arithmetic now exist; rather than assert they match, the sheet checks it on every
 * row every time it is opened.                                                        */
function archivePayload(idx){
  const p=S.paddles[idx], R=paddleResults(idx);
  if(!R || !R.summary) return null;
  const pre=ctrlBlock(S.pre), mid=ctrlBlock(S.mid), post=ctrlBlock(S.post);
  const n6 = v => (v==null||!isFinite(v)) ? '' : Math.round(v*1e6)/1e6;
  const num = v => { const x=parseFloat(v); return isFinite(x) ? x : ''; };
  const sp=p.spec||{};
  // Shots in FIRED ORDER, location by location. The sheet groups by the location column
  // rather than by position, but the order is kept because it is the record of what
  // happened and because the block corrections were computed against it.
  const shots=[];
  R.res.forEach(r => (r.rows||[]).forEach(sh =>
    shots.push([r.location, num(sh.vin), num(sh.vout),
                sh.gateCor==null||!isFinite(sh.gateCor) ? '' : sh.gateCor])));
  return {
    op:'archive',
    a:{
      date:S.date, person:S.person||'', temp:S.temp===''?'':+S.temp,
      mfr:p.mfr||'', model:p.name||'', ball:S.ballId, anchor:S.anchor,
      mode: R.dm.ramp ? 'RAMP - one D per location block' : 'POOLED - one D for the session',
      sp:{ sw:num(p.sw), len:num(p.len), w:num(sp.w), wt:num(sp.wt),
           tw:num(sp.tw), bp:num(sp.bp) },
      pre:{n:pre.n||'', mean:n6(pre.mean), se:n6(pre.se)},
      mid:{n:mid.n||'', mean:n6(mid.mean), se:n6(mid.se)},
      post:{n:post.n||'', mean:n6(post.mean), se:n6(post.se)},
      loc:R.res.map(r=>r.location),
      // FULL PRECISION, deliberately. D is not a display value — the sheet's KewCOR
      // formula divides into it, so rounding it here would put a real difference between
      // what the archive says and what was published, in the last places where the two
      // are supposed to be the same number. The P_pre/P_mid/P_post figures above are
      // rounded because nothing computes from them.
      blockD:R.res.map(r=>r.D),
      said:R.res.map(r=>r.kewcor),          // what THIS page computed, for the sheet to check
      shots,
      k:{ ballKg:K.C.ballKg, ballOz:K.C.ballOz, clampMOI:K.C.clampMOI,
          clampDepth:K.C.clampDepth, target:K.C.target, window:K.C.window,
          slope:K.C.slope, pRef:A().pRef }
    }
  };
}

function archivePaddle(idx){
  WRSCOPE='archive';
  const req=archivePayload(idx);
  if(!req){ WR={busy:'',tone:'warn',msg:'Nothing to archive yet.',detail:''}; return render(); }
  if(!EP.url){ WR={busy:'',tone:'bad',msg:'No write endpoint.',
    detail:'The archive is created by the Apps Script, so it needs the /exec URL set on '
         + 'the Ball registry tab.'}; return render(); }
  WR={busy:'archive', msg:'', tone:'', detail:''}; render();
  post('archive', req)
    .then(j=>{
      S.paddles[idx].archive={url:j.url, name:j.name};
      WR={busy:'', tone:'ok', msg:'Archived as '+j.name+'.',
          detail:j.shots+' shots across '+j.locations+' locations, in the '+j.folder
               + ' folder. Open it and check the Agrees? column reads "agrees" on every '
               + 'row before you rely on it.'};
      render();
    })
    .catch(e=>{
      // A missing Drive scope is the one failure that looks like something else: the
      // script was pasted but never re-authorized, and the error is about permissions
      // rather than about anything on this page.
      const scope=/PERMISSION|authoriz|scope|Drive/i.test(e.message||'');
      WR={busy:'', tone:'bad', msg:'The archive was not created.',
          detail:(scope
            ? 'This looks like the script not being authorized for Drive. Creating a sheet '
            + 'needs a permission the earlier version never asked for: open the script, '
            + 'Run the archive function once, and accept the prompt. Then redeploy. '
            : '') + e.message};
      render();
    });
}

/* ── shell ────────────────────────────────────────────────────────────────── */
function go(i){ S.step=Math.max(0,Math.min(STEPS.length-1,i)); window.scrollTo(0,0); render(); }

function render(){
  const ae=document.activeElement, keep={};
  if(ae && ae.id && (ae.tagName==='INPUT'||ae.tagName==='TEXTAREA')){
    keep.id=ae.id;
    try{ keep.a=ae.selectionStart; keep.b=ae.selectionEnd; }catch(e){}
  }
  paint();
  if(keep.id){
    const el=document.getElementById(keep.id);
    if(el){ el.focus(); if(keep.a!=null) try{ el.setSelectionRange(keep.a,keep.b); }catch(e){} }
  }
  save();
}
function paint(){
  modes.innerHTML = [['session','Session'],['registry','Ball registry']]
    .map(([k,t])=>`<button class="${S.mode===k?'on':''}" onclick="setMode('${k}')">${t}</button>`)
    .join('');
  document.querySelector('.wrap').classList.toggle('solo', S.mode!=='session');
  if(S.mode==='registry'){
    rail.innerHTML='';
    main.innerHTML = fileBanner() + scRegistry();
    hdrsub.textContent = RG.state==='ok'
      ? `${RG.rows.length} on the shelf · ${RG.rows.filter(b=>b.status==='IN ROTATION').length} in rotation`
      : 'the shelf';
    return;
  }
  rail.innerHTML = STEPS.map((s,i)=>{
    const skip = S.endedEarly && (i===4||i===5||i===6);
    return `<div class="step ${i===S.step?'on':''} ${i<S.step?'done':''} ${skip?'locked':''}"
      onclick="${skip?'':`go(${i})`}"><div class="dot">${i<S.step?'✓':i+1}</div>
      <div><b>${s.t}</b><span>${skip?'skipped':s.s}</span></div></div>`;
  }).join('');
  const i=S.step;
  main.innerHTML = fileBanner() + (i===0 ? scSession()
    : i===1 ? scControl('PRE')
    : i===2 ? scPaddle(0) : i===3 ? scPaddle(1)
    : i===4 ? scControl('MID')
    : i===5 ? scPaddle(2) : i===6 ? scPaddle(3)
    : i===7 ? scControl('POST') : scResults());
  hdrsub.textContent = `${S.date} · ${S.anchor} · ${S.ballId} · ${Math.round(effAge())} effective impacts`;
}
// The registry used to be named twice: once for the shelf reader, once for the Open
// button on Results. One of those is now gone, so a draft that only has the old one
// donates it rather than losing it.
if(!REGID && S.registryUrl){ const id=sheetId(S.registryUrl); if(id){ REGID=id;
  try{ localStorage.setItem(REG_KEY,id); }catch(e){} RG.state='idle'; } }

render();
// Attempt both even from file:// — a real error message beats a silently dead box.
loadPaddles();
loadShelf();
</script>
</body>
